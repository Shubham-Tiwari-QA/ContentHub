<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles | ContentHub</title><link rel="stylesheet" href="public.css"></head><body><header class="site-header" data-testid="header"><div class="container nav"><a class="brand" href="index.html">Content<span>Hub</span></a><button class="mobile-toggle">☰</button><nav class="nav-links"><a href="index.html">Home</a><a class="active" href="articles.html">Articles</a><a href="categories.html">Categories</a><a href="trending.html">Trending</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><a class="icon-btn" data-testid="search" href="search.html">⌕</a><a class="button" data-testid="create-content" href="create-content.html">Write</a><a class="button secondary" href="login.html">Login</a></div></div></header><main><section class="page-title"><div class="container"><span class="eyebrow">The library</span><h1>All articles</h1><p>Browse every published story, filtered by the things you care about.</p></div></section><section class="section"><div class="container"><div class="filters"><input class="input" id="articleSearch" data-testid="search" placeholder="Search articles..."><select class="select" id="articleCategory"></select><select class="select" id="articleAuthor"></select><select class="select" id="articleSort"><option value="date">Newest first</option><option value="views">Most viewed</option><option value="title">Title A-Z</option></select></div><div id="articleGrid" class="grid"></div><div style="text-align:center;margin-top:28px"><button id="loadMore" class="button secondary">Load more</button></div></div></section></main><footer class="footer"><div class="container footer-bottom">© 2026 ContentHub · <a href="index.html">Home</a></div></footer><script src="script.js"></script><script src="page.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const grid=document.getElementById('articleGrid'),button=document.getElementById('loadMore');let visible=6;const apply=()=>{const cards=[...grid.children];cards.forEach((card,index)=>{card.style.display=index<visible?'':'none';});button.hidden=cards.length<=visible;};new MutationObserver(apply).observe(grid,{childList:true});button.addEventListener('click',()=>{visible+=6;apply();});setTimeout(apply,0);});</script></body></html>
