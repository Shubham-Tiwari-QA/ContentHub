<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | ContentHub</title><link rel="stylesheet" href="public.css"></head><body><main><section class="section"><div class="container"><form id="signupForm" class="form-card card"><a class="brand" href="index.html">Content<span>Hub</span></a><h1>Create your account</h1><p class="muted">Join the community locally for now.</p><div class="field"><label>Full Name</label><input id="fullName" class="input" required></div><div class="field"><label>Email</label><input id="email" class="input" type="email" required></div><div class="field"><label>Mobile</label><input id="mobile" class="input" required></div><div class="field"><label>Password</label><input id="password" class="input" type="password" required></div><div class="field"><label>Confirm Password</label><input id="confirmPassword" class="input" type="password" required></div><button class="button" data-testid="signup" type="submit">Create account</button><p class="muted">Already a member? <a href="login.html">Login</a></p></form></div></section></main><script src="script.js"></script><script>document.getElementById('signupForm').addEventListener('submit',event=>{event.preventDefault();if(password.value!==confirmPassword.value){alert('Passwords do not match');return;}localStorage.setItem('contenthub_user',JSON.stringify({name:fullName.value,email:email.value,mobile:mobile.value}));alert('Account saved for this prototype');location.href='login.html';});</script></body></html>
