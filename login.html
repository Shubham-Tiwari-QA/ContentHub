<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ContentHub</title><link rel="stylesheet" href="public.css"></head><body><main><section class="section"><div class="container"><form id="loginForm" class="form-card card"><a class="brand" href="index.html">Content<span>Hub</span></a><h1>Welcome back</h1><p class="muted">Sign in locally for this prototype.</p><div class="field"><label>Email</label><input id="loginEmail" class="input" type="email" required></div><div class="field"><label>Password</label><input class="input" type="password" required></div><button class="button" data-testid="login" type="submit">Login</button><p class="muted">New here? <a href="signup.html">Create an account</a></p></form></div></section></main><script src="script.js"></script><script>document.getElementById('loginForm').addEventListener('submit',event=>{event.preventDefault();localStorage.setItem('contenthub_session',document.getElementById('loginEmail').value);alert('Login saved for this prototype');location.href='index.html';});</script></body></html>
