<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Content | ContentHub</title><link rel="stylesheet" href="admin-page.css"></head><body class="admin-page" data-admin-page="content"><header class="topbar"><div><div class="topbar-kicker">Content operations</div><h1>Content management</h1></div><div class="admin-user"><div class="admin-avatar">A</div><span>Admin workspace</span></div></header><main class="page"><nav class="admin-links"><a href="admin.html">Dashboard</a><a class="active" href="admin-content.html">Content</a><a href="admin-categories.html">Categories</a><a href="admin-authors.html">Authors</a><a href="admin-media.html">Media</a><a href="index.html">Public site</a></nav><section class="panel panel-body"><h2>Add content</h2><form id="addContentForm"><div class="form-grid"><div class="field full"><label>Title</label><input id="contentTitle" class="input" data-testid="content-title" required></div><div class="field"><label>Category</label><select id="contentCategory" class="select" data-testid="content-category"></select></div><div class="field"><label>Author</label><input id="contentAuthor" class="input" data-testid="content-author" value="Admin" required></div><div class="field"><label>Tags</label><input id="contentTags" class="input"></div><div class="field"><label>Cover image URL</label><input id="contentImage" class="input" type="url"></div><div class="field"><label>Status</label><select id="contentStatus" class="select" data-testid="content-status"><option>Draft</option><option>Published</option><option>Scheduled</option></select></div><div class="field full"><label>Short description</label><textarea id="contentDescription" class="textarea" required></textarea></div><div class="field full"><label>Full content</label><textarea id="contentFull" class="textarea" rows="7" required></textarea></div></div><button class="button" data-testid="save-content" type="submit">Save content</button></form></section><section class="panel"><div class="panel-header"><h2>All content</h2></div><div class="panel-body"><div class="toolbar"><input id="contentSearch" class="input" placeholder="Search title, category, author..."><select id="contentCategoryFilter" class="select"><option value="">All categories</option></select><select id="contentStatusFilter" class="select"><option value="">All statuses</option><option>Published</option><option>Draft</option><option>Scheduled</option></select></div><div class="table-wrap"><table><thead><tr><th>Image</th><th>Title</th><th>Category</th><th>Author</th><th>Status</th><th>Date</th><th>Views</th><th>Actions</th></tr></thead><tbody id="contentTable"></tbody></table></div></div></section></main><script src="script.js"></script><script src="admin-pages.js"></script></body></html>
