<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Web Stories | ContentHub</title><link rel="stylesheet" href="admin-page.css"><link rel="stylesheet" href="web-stories.css"></head><body class="admin-page" data-admin-story-page="true"><header class="topbar"><div><div class="topbar-kicker">Content operations</div><h1>Web Stories</h1></div><div class="admin-user"><div class="admin-avatar">A</div><span>Admin workspace</span></div></header><main class="page" data-testid="admin-web-stories"><nav class="admin-links"><a href="admin.html">Dashboard</a><a href="admin-content.html">Content</a><a href="admin-categories.html">Categories</a><a class="active" href="admin-web-stories.html">Web Stories</a><a href="admin-authors.html">Authors</a><a href="admin-media.html">Media</a><a href="index.html">Public site</a></nav><section class="panel panel-body"><div class="toolbar"><div><h2 id="storyEditorHeading">Add Web Story</h2><p class="topbar-kicker">Build a short visual journey, one slide at a time.</p></div><button id="newStory" class="button secondary">New story</button></div><form id="storyForm"><input type="hidden" id="storyId"><div class="form-grid"><div class="field full"><label for="storyTitle">Story Title</label><input id="storyTitle" class="input" data-testid="story-title" required></div><div class="field"><label for="storyCover">Cover Image URL</label><input id="storyCover" class="input" data-testid="story-cover" type="url"><div id="coverPreview" class="image-preview">9:16 cover preview</div></div><div class="field"><label for="storyCategory">Category</label><select id="storyCategory" class="select" data-testid="story-category"></select></div><div class="field"><label for="storyAuthor">Author</label><input id="storyAuthor" class="input" data-testid="story-author" value="Admin" required></div><div class="field"><label for="storyStatus">Status</label><select id="storyStatus" class="select" data-testid="story-status"><option>Draft</option><option>Published</option></select></div><div class="field story-check"><label><input id="storyFeatured" data-testid="story-featured" type="checkbox"> Mark Featured</label></div><div class="field full"><label for="storyDescription">Description</label><textarea id="storyDescription" class="textarea" rows="3" required></textarea></div></div><div class="story-slides-header"><h3>Slides</h3><button id="addSlide" type="button" class="button secondary" data-testid="add-slide">+ Add New Slide</button></div><div id="slideList"></div><div class="form-actions"><button id="saveStory" class="button secondary" data-testid="save-story" type="submit">Save Draft</button><button id="publishStory" class="button" data-testid="publish-story" type="button">Publish</button></div></form></section><section class="panel"><div class="panel-header"><h2>All Web Stories</h2></div><div class="panel-body"><div class="toolbar"><input id="storySearch" class="input" placeholder="Search title, category, author..."><select id="storyStatusFilter" class="select"><option value="">All statuses</option><option>Published</option><option>Draft</option></select><select id="storyCategoryFilter" class="select"><option value="">All categories</option></select></div><div class="table-wrap"><table><thead><tr><th>Cover</th><th>Story Title</th><th>Category</th><th>Author</th><th>Slides</th><th>Status</th><th>Featured</th><th>Created Date</th><th>Actions</th></tr></thead><tbody id="storyTable"></tbody></table></div></div></section></main><script src="script.js"></script><script src="admin.js"></script><script src="admin-web-stories.js"></script></body></html>
